 {% extends "base.html" %}

{% block title %}Login | FitZone Gym{% endblock %}

{% block content %}

<div class="container py-5">
 
 <div class="row justify-content-center">
        <div class="col-md-6">

            <h1 class="text-center mb-4">Login</h1>

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">
                    Login
                </button>
            </form>

        </div>
    </div>
</div>

{% endblock %}
